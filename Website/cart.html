<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Always & Forever Blooms - Express Cart</title>

    <meta property="og:title" content="Always & Forever Blooms | Luxury Floral Delivery">
    <meta property="og:description" content="Hand-crafted luxury rose bouquets with same-day delivery across Gauteng.">
    <meta property="og:image" content="images/logo.jpeg">
    <meta property="og:type" content="website">
</head>
<body>

  <section id="header-section">
    <a href="Homepage.html"><img src="images/logo.jpeg" alt="Always and Forever Blooms Logo" class="logo"></a>
    <ul id="navbar">
      <li><a href="Homepage.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="reviews.html">Reviews</a></li>
      <li><a href="faq.html">FAQ</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html"><i class="bi bi-person"></i></a></li>
      <li>
        <a href="cart.html" id="cart-nav-link" class="active">
          <i class="bi bi-bag"></i>
          <span id="cart-badge" style="display: none;">0</span>
        </a>
      </li>
    </ul>
  </section>

  <main>
    <h1>Your Shopping Cart & Delivery</h1>
    
    <!-- Dynamic Cart Items Review Container -->
    <section class="glass-card" style="margin-bottom: 24px;">
      <h2>Review Selected Items</h2>
      <div id="cart-items-container" style="margin-top: 15px;">
        <!-- Injected dynamically by script.js -->
      </div>
    </section>

    <form action="checkout.html" method="POST">
      <section>
        <h2>Step 1: Recipient Details</h2>
        <br>
        <label for="recip-name">Recipient Full Name:</label>
        <input type="text" id="recip-name" name="recipient_name" required><br><br>

        <label for="recip-phone">Recipient Mobile Phone (For Driver):</label>
        <input type="tel" id="recip-phone" name="recipient_phone" required><br><br>

        <label for="recip-address">Delivery Street Address:</label>
        <textarea id="recip-address" name="recipient_address" rows="3" required></textarea>
      </section>

      <section>
        <h2>Step 2: Personalized Gift Card Note</h2>
        <br>
        <label for="card-note">Write your card message (Max 250 characters):</label>
        <textarea id="card-note" name="card_note" maxlength="250" rows="4"></textarea><br><br>
        <label><input type="checkbox" name="anonymous_sender"> Keep my name anonymous on the recipient card</label>
      </section>

      <section>
        <h2>Step 3: Buyer Details</h2>
        <br>
        <label for="buyer-email">Your Email Address (For Order Tracking):</label>
        <input type="email" id="buyer-email" name="buyer_email" required><br><br>

        <button type="submit" style="width: 100%;">Proceed to Secure Payment</button>
      </section>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Always & Forever Blooms. All rights reserved.</p>
  </footer>

</body>
</html>
